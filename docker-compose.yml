version: '3.8'

services:
  # Service 1: The FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads  # Persist uploaded files
      - ./app:/app/app          # Hot-reload code changes (optional)

  # Service 2: The Streamlit Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000  # Tells frontend to talk to 'backend' service
      - DB_HOST=host.docker.internal
    depends_on:
      - backend